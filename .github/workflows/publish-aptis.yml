name: Publish Aptis Question Bank

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-aptis.yml
      - scripts/build_aptis_bank.py
      - aptis/app.js
      - aptis/index.html
  workflow_dispatch:
    inputs:
      sheet_id:
        description: Google Sheets file ID
        required: true
        default: 1hZcMUOLWsljPvzbvw3LmdEaOMo5Rt_-H31sqMxppYjU
      version:
        description: Question-bank release version
        required: true
        default: 1.0.0
      xlsx_url:
        description: Optional direct XLSX URL; leave empty to use Google Sheets export
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ inputs.sheet_id || vars.APTIS_SHEET_ID || '1hZcMUOLWsljPvzbvw3LmdEaOMo5Rt_-H31sqMxppYjU' }}
      RELEASE_VERSION: ${{ inputs.version || '1.0.0' }}
      XLSX_URL: ${{ inputs.xlsx_url || vars.APTIS_XLSX_URL || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependency
        run: python -m pip install openpyxl==3.1.5

      - name: Download source workbook
        run: |
          set -euo pipefail
          if [[ -z "$XLSX_URL" ]]; then
            XLSX_URL="https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=xlsx"
          fi
          TARGET="${RUNNER_TEMP}/aptis-question-bank.xlsx"
          curl --fail --location --retry 3 --retry-delay 2 --output "$TARGET" "$XLSX_URL"
          TARGET="$TARGET" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ["TARGET"])
          if path.stat().st_size < 10_000:
              raise SystemExit(f"Downloaded workbook is unexpectedly small: {path.stat().st_size} bytes")
          if path.read_bytes()[:2] != b"PK":
              raise SystemExit("Downloaded file is not an XLSX archive. Check Google Sheets sharing permissions.")
          PY

      - name: Build and validate static snapshot
        run: |
          python scripts/build_aptis_bank.py \
            --input "${RUNNER_TEMP}/aptis-question-bank.xlsx" \
            --output-dir aptis/data \
            --version "$RELEASE_VERSION" \
            --source-sheet-id "$SHEET_ID"

      - name: Commit generated snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aptis/data/grammar.json aptis/data/vocabulary.json aptis/data/manifest.json
          if git diff --cached --quiet; then
            echo "Question-bank snapshot is unchanged."
          else
            git commit -m "chore(aptis): publish question bank ${RELEASE_VERSION}"
            git push
          fi

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
