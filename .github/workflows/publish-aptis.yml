name: Publish Aptis Question Bank

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-aptis.yml
      - scripts/build_aptis_bank.py
      - scripts/build_aptis_bank_v4.py
      - aptis/app.js
      - aptis/runtime-v4.js
      - aptis/index.html
      - aptis/styles.css
  workflow_dispatch:
    inputs:
      sheet_id:
        description: Public Google Sheets Learning Graph file ID
        required: true
        default: 1JStevkoPtjIqjgOvyUhndKZDDIIu2pwpphJzTKoSpPA
      version:
        description: Question-bank release version
        required: true
        default: 4.0.0
      xlsx_url:
        description: Optional public or pre-signed XLSX URL
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ inputs.sheet_id || vars.APTIS_SHEET_ID || '1JStevkoPtjIqjgOvyUhndKZDDIIu2pwpphJzTKoSpPA' }}
      RELEASE_VERSION: ${{ inputs.version || '4.0.0' }}
      XLSX_URL: ${{ inputs.xlsx_url || vars.APTIS_XLSX_URL || '' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.APTIS_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependencies
        run: |
          python -m pip install \
            openpyxl==3.1.5 \
            "google-auth>=2.0,<3" \
            "requests>=2.31,<3"

      - name: Download source workbook
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${RUNNER_TEMP}/aptis-question-bank.xlsx"
          export TARGET
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          target = Path(os.environ["TARGET"])
          sheet_id = os.environ["SHEET_ID"].strip()
          xlsx_url = os.environ.get("XLSX_URL", "").strip()
          secret = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
          mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

          if xlsx_url:
              print("Downloading workbook from XLSX_URL")
              response = requests.get(xlsx_url, timeout=120, allow_redirects=True)
          elif secret:
              print("Exporting Google Sheet with service-account authentication")
              credentials = service_account.Credentials.from_service_account_info(
                  json.loads(secret),
                  scopes=["https://www.googleapis.com/auth/drive.readonly"],
              )
              response = AuthorizedSession(credentials).get(
                  f"https://www.googleapis.com/drive/v3/files/{sheet_id}/export",
                  params={"mimeType": mime},
                  timeout=120,
              )
          else:
              print("Exporting public Google Sheet")
              response = requests.get(
                  f"https://docs.google.com/spreadsheets/d/{sheet_id}/export?format=xlsx",
                  timeout=120,
                  allow_redirects=True,
              )

          if response.status_code in (401, 403):
              raise SystemExit(
                  "Google Sheet is not publicly readable. Set Anyone with the link → Viewer, "
                  "or configure APTIS_GOOGLE_SERVICE_ACCOUNT_JSON."
              )
          response.raise_for_status()
          target.write_bytes(response.content)
          size = target.stat().st_size
          if size < 10_000 or target.read_bytes()[:2] != b"PK":
              raise SystemExit(f"Downloaded content is not a valid XLSX archive ({size} bytes)")
          print(f"Workbook downloaded successfully: {size} bytes")
          PY

      - name: Build and validate Learning Graph v4
        run: |
          python scripts/build_aptis_bank_v4.py \
            --input "${RUNNER_TEMP}/aptis-question-bank.xlsx" \
            --output-dir aptis/data \
            --version "$RELEASE_VERSION" \
            --source-sheet-id "$SHEET_ID"

      - name: Commit generated snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add aptis/data/*.json
          if git diff --cached --quiet; then
            echo "Learning Graph snapshot is unchanged."
          else
            git commit -m "chore(aptis): publish Learning Graph ${RELEASE_VERSION}"
            git pull --rebase origin master
            git push origin HEAD:master
          fi

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
