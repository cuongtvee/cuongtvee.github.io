name: Publish Aptis Question Bank

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/publish-aptis.yml
      - scripts/build_aptis_bank.py
      - aptis/app.js
      - aptis/index.html
  workflow_dispatch:
    inputs:
      sheet_id:
        description: Google Sheets Learning Graph file ID
        required: true
        default: 1GeRWLpVlBeW34EGlapJyHO6vi1yoE7Q84DgumaQx2Dg
      version:
        description: Question-bank release version
        required: true
        default: 2.0.0
      xlsx_url:
        description: Optional public or pre-signed XLSX URL; leave empty to export Google Sheets
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHEET_ID: ${{ inputs.sheet_id || vars.APTIS_SHEET_ID || '1GeRWLpVlBeW34EGlapJyHO6vi1yoE7Q84DgumaQx2Dg' }}
      RELEASE_VERSION: ${{ inputs.version || '2.0.0' }}
      XLSX_URL: ${{ inputs.xlsx_url || vars.APTIS_XLSX_URL || '' }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.APTIS_GOOGLE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install builder dependencies
        run: |
          python -m pip install \
            openpyxl==3.1.5 \
            "google-auth>=2.0,<3" \
            "requests>=2.31,<3"

      - name: Download source workbook
        shell: bash
        run: |
          set -euo pipefail
          TARGET="${RUNNER_TEMP}/aptis-question-bank.xlsx"
          export TARGET

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          import requests
          from google.auth.transport.requests import AuthorizedSession
          from google.oauth2 import service_account

          target = Path(os.environ["TARGET"])
          sheet_id = os.environ["SHEET_ID"].strip()
          xlsx_url = os.environ.get("XLSX_URL", "").strip()
          service_account_json = os.environ.get("GOOGLE_SERVICE_ACCOUNT_JSON", "").strip()
          xlsx_mime = "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"

          def save_response(response: requests.Response, source: str) -> None:
              try:
                  response.raise_for_status()
              except requests.HTTPError as exc:
                  body = response.text[:500].replace("\n", " ")
                  raise SystemExit(
                      f"Failed to download workbook from {source}: "
                      f"HTTP {response.status_code}. Response: {body}"
                  ) from exc
              target.write_bytes(response.content)

          if xlsx_url:
              print("Downloading workbook from XLSX_URL.")
              response = requests.get(xlsx_url, timeout=120, allow_redirects=True)
              save_response(response, "XLSX_URL")
          elif service_account_json:
              print("Exporting private Google Sheet with service-account authentication.")
              try:
                  service_account_info = json.loads(service_account_json)
              except json.JSONDecodeError as exc:
                  raise SystemExit(
                      "GitHub secret APTIS_GOOGLE_SERVICE_ACCOUNT_JSON is not valid JSON."
                  ) from exc

              credentials = service_account.Credentials.from_service_account_info(
                  service_account_info,
                  scopes=["https://www.googleapis.com/auth/drive.readonly"],
              )
              session = AuthorizedSession(credentials)
              export_url = f"https://www.googleapis.com/drive/v3/files/{sheet_id}/export"
              response = session.get(
                  export_url,
                  params={"mimeType": xlsx_mime},
                  timeout=120,
              )
              save_response(response, "Google Drive API")
          else:
              print("No service-account secret found; trying unauthenticated Google Sheets export.")
              public_url = f"https://docs.google.com/spreadsheets/d/{sheet_id}/export?format=xlsx"
              response = requests.get(public_url, timeout=120, allow_redirects=True)
              if response.status_code in (401, 403):
                  raise SystemExit(
                      "The Google Sheet is private. Add repository secret "
                      "APTIS_GOOGLE_SERVICE_ACCOUNT_JSON and share the Sheet with the "
                      "service account's client_email, or provide a public/pre-signed XLSX_URL."
                  )
              save_response(response, "public Google Sheets export")

          size = target.stat().st_size
          if size < 10_000:
              raise SystemExit(f"Downloaded workbook is unexpectedly small: {size} bytes")
          if target.read_bytes()[:2] != b"PK":
              raise SystemExit(
                  "Downloaded file is not an XLSX archive. Check credentials, sharing, and URL."
              )
          print(f"Workbook downloaded successfully: {size} bytes")
          PY

      - name: Build and validate static Learning Graph snapshot
        run: |
          python scripts/build_aptis_bank.py \
            --input "${RUNNER_TEMP}/aptis-question-bank.xlsx" \
            --output-dir aptis/data \
            --version "$RELEASE_VERSION" \
            --source-sheet-id "$SHEET_ID"

      - name: Commit generated snapshot
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            aptis/data/grammar.json \
            aptis/data/vocabulary.json \
            aptis/data/concepts.json \
            aptis/data/edges.json \
            aptis/data/item_graph.json \
            aptis/data/adaptive_rules.json \
            aptis/data/learner_state.json \
            aptis/data/manifest.json
          if git diff --cached --quiet; then
            echo "Learning Graph snapshot is unchanged."
          else
            git commit -m "chore(aptis): publish Learning Graph ${RELEASE_VERSION}"
            git push
          fi

      - name: Prepare site artifact
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'scripts' \
            --exclude '_site' \
            ./ _site/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
